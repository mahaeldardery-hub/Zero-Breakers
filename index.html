<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO BREAKERS - The Regrouping Quest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            /* Prevent bounce scrolling on mobile */
            overscroll-behavior-y: none; 
        }

        h1, h2, h3, .display-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Strikethrough animation for regrouping */
        .strike-anim {
            position: relative;
            display: inline-block;
        }
        .strike-anim::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -10%;
            width: 120%;
            height: 2px;
            background: #ef4444;
            transform: rotate(-15deg);
            animation: strike 0.3s ease-out forwards;
        }
        @keyframes strike {
            0% { width: 0; opacity: 0; }
            100% { width: 120%; opacity: 1; }
        }

        /* Float animation for XP */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
        }
        .xp-pop {
            animation: floatUp 1.2s ease-out forwards;
            position: absolute;
            pointer-events: none;
            color: #fbbf24;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 50;
        }

        /* Block animations */
        .block-appear {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Pulse for hints */
        .hint-pulse {
            animation: pulseHint 2s infinite;
        }
        @keyframes pulseHint {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* Print Styles for Certificate */
        @media print {
            body * { visibility: hidden; }
            #certificate-area, #certificate-area * { visibility: visible; }
            #certificate-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100vh;
                margin: 0;
                padding: 0;
                background: white !important;
            }
            .no-print { display: none !important; }
            @page { size: landscape; margin: 0; }
        }
        
        /* Map Path Dashes */
        .path-dash {
            stroke-dasharray: 10;
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const LEVELS = [
            { id: 'training', title: 'Training Lab', desc: 'Unlock the Regrouping Machine' },
            { id: 'level1', title: 'Break the Zero', desc: 'Repair the Place-Value Power Station' },
            { id: 'level2', title: 'Zero Chain', desc: 'Cross the Zero Bridge' },
            { id: 'level3', title: 'Algorithm Arena', desc: 'Activate the Subtraction Engine' },
            { id: 'level4', title: 'Error Hunters', desc: 'Catch the Glitch' },
            { id: 'level5', title: 'Strategy Masters', desc: 'Choose the Strongest Strategy' },
            { id: 'level6', title: 'The Zero Vault', desc: 'Final Boss Challenge' }
        ];

        const ICONS = {
            lock: <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
            check: <svg className="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            star: <svg className="w-5 h-5 text-yellow-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>,
            arrowRight: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>,
            undo: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>,
            refresh: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        };

        const BlockVisuals = {
            One: () => <svg className="w-4 h-4 text-cyan-400 block-appear" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="16" height="16" rx="2" stroke="white" strokeWidth="1"/></svg>,
            Ten: () => <svg className="w-4 h-16 text-emerald-400 block-appear" viewBox="0 0 20 80" fill="currentColor"><rect x="2" y="2" width="16" height="76" rx="2" stroke="white" strokeWidth="1"/><line x1="2" y1="9.5" x2="18" y2="9.5" stroke="white" strokeWidth="1"/><line x1="2" y1="17" x2="18" y2="17" stroke="white" strokeWidth="1"/><line x1="2" y1="24.5" x2="18" y2="24.5" stroke="white" strokeWidth="1"/><line x1="2" y1="32" x2="18" y2="32" stroke="white" strokeWidth="1"/><line x1="2" y1="39.5" x2="18" y2="39.5" stroke="white" strokeWidth="1"/><line x1="2" y1="47" x2="18" y2="47" stroke="white" strokeWidth="1"/><line x1="2" y1="54.5" x2="18" y2="54.5" stroke="white" strokeWidth="1"/><line x1="2" y1="62" x2="18" y2="62" stroke="white" strokeWidth="1"/><line x1="2" y1="69.5" x2="18" y2="69.5" stroke="white" strokeWidth="1"/></svg>,
            Hundred: () => <svg className="w-16 h-16 text-orange-400 block-appear" viewBox="0 0 80 80" fill="currentColor"><rect x="2" y="2" width="76" height="76" rx="2" stroke="white" strokeWidth="1"/><path d="M9.5 2 v76 M17 2 v76 M24.5 2 v76 M32 2 v76 M39.5 2 v76 M47 2 v76 M54.5 2 v76 M62 2 v76 M69.5 2 v76" stroke="white" strokeWidth="0.5"/><path d="M2 9.5 h76 M2 17 h76 M2 24.5 h76 M2 32 h76 M2 39.5 h76 M2 47 h76 M2 54.5 h76 M2 62 h76 M2 69.5 h76" stroke="white" strokeWidth="0.5"/></svg>,
            Thousand: () => <svg className="w-20 h-20 text-purple-400 block-appear" viewBox="0 0 100 100" fill="currentColor"><polygon points="20,80 80,80 100,60 100,0 40,0 20,20" stroke="white" strokeWidth="1"/><polygon points="20,20 80,20 100,0" stroke="white" strokeWidth="1" fill="none"/><line x1="80" y1="80" x2="80" y2="20" stroke="white" strokeWidth="1"/><text x="45" y="55" fill="white" fontSize="20" fontWeight="bold">1000</text></svg>,
            TenThousand: () => <svg className="w-24 h-24 text-pink-500 block-appear" viewBox="0 0 120 120" fill="currentColor"><rect x="10" y="10" width="100" height="100" rx="8" stroke="white" strokeWidth="2"/><text x="25" y="65" fill="white" fontSize="24" fontWeight="bold">10,000</text></svg>
        };

        const ZeroX = ({ emotion = 'normal', size = 'normal' }) => {
            const dims = size === 'small' ? 'w-12 h-12' : 'w-24 h-24';
            return (
                <div className={`relative ${dims} flex-shrink-0 bg-slate-800 rounded-2xl border-4 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.5)] overflow-hidden flex flex-col items-center justify-center`}>
                    <div className="absolute top-0 w-full h-2 bg-slate-700"></div>
                    <div className="flex gap-2 mb-2">
                        {/* Eyes */}
                        <div className={`w-3 h-3 rounded-full bg-cyan-400 ${emotion==='happy'?'animate-bounce':''} shadow-[0_0_8px_#22d3ee]`}></div>
                        <div className={`w-3 h-3 rounded-full bg-cyan-400 ${emotion==='happy'?'animate-bounce':''} shadow-[0_0_8px_#22d3ee]`}></div>
                    </div>
                    {/* Mouth */}
                    {emotion === 'happy' && <div className="w-8 h-3 border-b-2 border-cyan-400 rounded-b-full"></div>}
                    {emotion === 'normal' && <div className="w-6 h-1 bg-cyan-400 rounded-full"></div>}
                    {emotion === 'thinking' && <div className="w-4 h-4 border-2 border-cyan-400 rounded-full animate-pulse"></div>}
                    {emotion === 'shock' && <div className="w-4 h-4 border-2 border-orange-400 rounded-full"></div>}
                </div>
            );
        };

        // Helper to convert number to array of digits, padded to a certain length
        const getDigits = (num, length) => {
            const str = num.toString().padStart(length, '0');
            return str.split('').map(Number);
        };

        const PLACE_NAMES = ['Ten Thousands', 'Thousands', 'Hundreds', 'Tens', 'Ones'];
        const PLACE_VALUES = [10000, 1000, 100, 10, 1];

        const createInitialState = (minuend, subtrahend) => {
            const len = Math.max(minuend.toString().length, subtrahend.toString().length);
            const mDigits = getDigits(minuend, len);
            const sDigits = getDigits(subtrahend, len);
            
            // Generate columns from right to left (Ones, Tens, etc.) then reverse to display left to right
            const columns = mDigits.map((val, i) => {
                const placeIndex = 5 - len + i; // Map to Ten Thousands, etc.
                return {
                    id: `col-${i}`,
                    name: PLACE_NAMES[placeIndex],
                    value: PLACE_VALUES[placeIndex],
                    topHistory: [val], // History of values in the top row (for strike-through)
                    subtrahend: sDigits[i],
                    userInput: ''
                };
            });
            return columns;
        };

        const SubtractionWorkspace = ({ 
            minuend, 
            subtrahend, 
            mode = 'model', // 'model' (shows blocks), 'algorithm' (just numbers), 'mixed'
            onSolve, 
            showHint = false,
            hintMessage = '',
            readOnly = false
        }) => {
            const [columns, setColumns] = useState(() => createInitialState(minuend, subtrahend));
            const [feedback, setFeedback] = useState(null);
            const [history, setHistory] = useState([createInitialState(minuend, subtrahend)]);

            // Reset when props change
            useEffect(() => {
                const init = createInitialState(minuend, subtrahend);
                setColumns(init);
                setHistory([init]);
                setFeedback(null);
            }, [minuend, subtrahend]);

            const handleRegroup = (fromIndex) => {
                if (readOnly) return;
                const toIndex = fromIndex + 1;
                if (toIndex >= columns.length) return;

                const newCols = JSON.parse(JSON.stringify(columns)); // Deep copy
                const fromCol = newCols[fromIndex];
                const toCol = newCols[toIndex];

                const currentFromVal = fromCol.topHistory[fromCol.topHistory.length - 1];
                const currentToVal = toCol.topHistory[toCol.topHistory.length - 1];

                if (currentFromVal === 0) {
                    setFeedback({ type: 'error', msg: `Cannot regroup from ${fromCol.name} because it has 0 units. You need to regroup from a greater place first.` });
                    return;
                }

                // Perform exchange mathematically: 1 large unit = 10 smaller units
                fromCol.topHistory.push(currentFromVal - 1);
                toCol.topHistory.push(currentToVal + 10);

                setColumns(newCols);
                setHistory([...history, newCols]);
                setFeedback({ type: 'success', msg: `Exchanged 1 ${fromCol.name.slice(0,-1)} for 10 ${toCol.name}. Total value remains the same.` });
            };

            const handleUndo = () => {
                if (readOnly || history.length <= 1) return;
                const newHistory = history.slice(0, -1);
                setHistory(newHistory);
                setColumns(newHistory[newHistory.length - 1]);
                setFeedback(null);
            };

            const handleReset = () => {
                if (readOnly) return;
                const init = createInitialState(minuend, subtrahend);
                setColumns(init);
                setHistory([init]);
                setFeedback(null);
            };

            const handleInputChange = (index, val) => {
                if (readOnly) return;
                const newCols = [...columns];
                newCols[index].userInput = val;
                setColumns(newCols);
            };

            const checkAnswer = () => {
                if (readOnly) return;
                // Check if bottom row is fully filled
                if (columns.some(c => c.userInput === '')) {
                    setFeedback({ type: 'error', msg: "Complete the subtraction in all columns." });
                    return;
                }

                const expectedAnswer = minuend - subtrahend;
                const studentAnswerStr = columns.map(c => c.userInput).join('');
                const studentAnswerNum = parseInt(studentAnswerStr, 10);

                if (studentAnswerNum === expectedAnswer) {
                    // It's numerically correct, but did they regroup properly?
                    // Programmatic check: did they *need* to regroup?
                    let validRegrouping = true;
                    let logicError = "";

                    // Re-calculate expected top row to verify logic
                    let tempMin = getDigits(minuend, columns.length);
                    let tempSub = getDigits(subtrahend, columns.length);
                    
                    for (let i = columns.length - 1; i >= 0; i--) {
                        let finalTopVal = columns[i].topHistory[columns[i].topHistory.length - 1];
                        if (finalTopVal < tempSub[i]) {
                            validRegrouping = false;
                            logicError = `In the ${columns[i].name} column, you tried to subtract ${tempSub[i]} from ${finalTopVal}. You must regroup first!`;
                            break;
                        }
                    }

                    if (validRegrouping) {
                        setFeedback({ type: 'success', msg: "Mathematically correct! Excellent regrouping." });
                        setTimeout(() => onSolve(true), 1500);
                    } else {
                        setFeedback({ type: 'error', msg: logicError || "Answer is correct, but your regrouping steps above are missing or incorrect." });
                    }
                } else {
                    // Find first error from right to left
                    for (let i = columns.length - 1; i >= 0; i--) {
                        let finalTopVal = columns[i].topHistory[columns[i].topHistory.length - 1];
                        let subVal = columns[i].subtrahend;
                        let expectedDiff = finalTopVal - subVal;
                        
                        if (parseInt(columns[i].userInput, 10) !== expectedDiff) {
                            if (finalTopVal < subVal) {
                                setFeedback({ type: 'error', msg: `Look at the ${columns[i].name} column. You have ${finalTopVal} but need to subtract ${subVal}. You need to regroup!` });
                            } else {
                                setFeedback({ type: 'error', msg: `Check your subtraction in the ${columns[i].name} column: ${finalTopVal} - ${subVal} is not ${columns[i].userInput}.` });
                            }
                            return;
                        }
                    }
                    setFeedback({ type: 'error', msg: "Something went wrong. Check your steps." });
                }
            };

            const renderBlocks = (col, index) => {
                const currentVal = col.topHistory[col.topHistory.length - 1];
                let BlockComponent = BlockVisuals.One;
                if (col.name === 'Tens') BlockComponent = BlockVisuals.Ten;
                if (col.name === 'Hundreds') BlockComponent = BlockVisuals.Hundred;
                if (col.name === 'Thousands') BlockComponent = BlockVisuals.Thousand;
                if (col.name === 'Ten Thousands') BlockComponent = BlockVisuals.TenThousand;

                const blocks = [];
                for(let i=0; i<currentVal; i++) {
                    blocks.push(<BlockComponent key={i} />);
                }

                // Render in a grid/flex container to keep it tidy
                return (
                    <div className="flex flex-wrap gap-1 justify-center content-start min-h-[100px] max-h-[150px] overflow-y-auto p-1 bg-slate-800/50 rounded">
                        {blocks.length > 0 ? blocks : <span className="text-slate-600 text-xs mt-4">0</span>}
                    </div>
                );
            };

            return (
                <div className="w-full bg-slate-900 p-4 sm:p-6 rounded-xl shadow-inner border border-slate-700">
                    
                    {/* Controls */}
                    {!readOnly && (
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex gap-2">
                                <button onClick={handleUndo} disabled={history.length <= 1} className="p-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg transition-colors" title="Undo Last Exchange">
                                    {ICONS.undo}
                                </button>
                                <button onClick={handleReset} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors" title="Reset Problem">
                                    {ICONS.refresh}
                                </button>
                            </div>
                            <div className="text-cyan-400 font-bold display-font tracking-wider">
                                {minuend} - {subtrahend}
                            </div>
                        </div>
                    )}

                    {/* Feedback Area */}
                    {(feedback || hintMessage) && (
                        <div className={`mb-6 p-4 rounded-lg border flex items-start gap-3 ${
                            feedback?.type === 'error' ? 'bg-orange-950/50 border-orange-500/50 text-orange-200' :
                            feedback?.type === 'success' ? 'bg-green-950/50 border-green-500/50 text-green-200' :
                            'bg-cyan-950/50 border-cyan-500/50 text-cyan-200'
                        }`}>
                            <ZeroX emotion={feedback?.type === 'error' ? 'shock' : feedback?.type === 'success' ? 'happy' : 'thinking'} size="small" />
                            <div className="flex-1 pt-1 font-medium">
                                {feedback?.msg || hintMessage}
                            </div>
                        </div>
                    )}

                    {/* Workspace Grid */}
                    <div className="flex justify-center w-full overflow-x-auto pb-4">
                        <div className="flex gap-1 sm:gap-4 relative items-end">
                            {/* Operator Sign */}
                            <div className="absolute left-[-2rem] bottom-[4.5rem] text-3xl font-bold text-slate-400">-</div>

                            {columns.map((col, idx) => (
                                <div key={col.id} className="flex flex-col items-center min-w-[60px] sm:min-w-[80px]">
                                    
                                    {/* Visual Blocks (if mode is model or mixed) */}
                                    {mode !== 'algorithm' && (
                                        <div className="mb-4 w-full">
                                            <div className="text-[10px] sm:text-xs text-center text-slate-400 uppercase tracking-wider mb-2 h-8 flex items-end justify-center">
                                                {col.name}
                                            </div>
                                            {renderBlocks(col, idx)}
                                        </div>
                                    )}

                                    {/* Regrouping Button Area (between columns) */}
                                    {!readOnly && idx < columns.length - 1 && (
                                        <div className="absolute h-8" style={{ right: `calc(${((columns.length - 1 - idx) / columns.length) * 100}% - 1.5rem)`, top: mode==='algorithm'? '4rem' : '10rem', zIndex: 10 }}>
                                            <button 
                                                onClick={() => handleRegroup(idx)}
                                                className={`text-xs bg-cyan-600 hover:bg-cyan-500 text-white rounded px-2 py-1 shadow-lg transform transition active:scale-90 ${col.topHistory[col.topHistory.length-1] === 0 ? 'opacity-50 cursor-not-allowed bg-slate-600' : ''}`}
                                                title={`Exchange 1 ${col.name} for 10 ${columns[idx+1].name}`}
                                            >
                                                &#8594;
                                            </button>
                                        </div>
                                    )}

                                    {/* Algorithm View: Top Row (Regrouping History) */}
                                    <div className="flex flex-col items-center justify-end h-24 sm:h-32 w-full border-b-2 border-slate-600 pb-2">
                                        {col.topHistory.map((val, hIdx) => {
                                            const isLast = hIdx === col.topHistory.length - 1;
                                            return (
                                                <div 
                                                    key={hIdx} 
                                                    className={`text-xl sm:text-3xl font-bold display-font transition-all duration-300 ${isLast ? 'text-cyan-400 scale-110' : 'text-slate-500 strike-anim scale-90'}`}
                                                >
                                                    {val}
                                                </div>
                                            )
                                        })}
                                    </div>

                                    {/* Algorithm View: Subtrahend */}
                                    <div className="text-xl sm:text-3xl font-bold display-font text-slate-300 mt-4 mb-4">
                                        {col.subtrahend}
                                    </div>

                                    {/* Input Area */}
                                    <input 
                                        type="text" 
                                        maxLength="1"
                                        disabled={readOnly}
                                        value={col.userInput}
                                        onChange={(e) => handleInputChange(idx, e.target.value.replace(/[^0-9]/g, ''))}
                                        className={`w-12 h-12 sm:w-16 sm:h-16 text-center text-xl sm:text-3xl font-bold rounded-lg border-2 bg-slate-800 focus:outline-none focus:border-cyan-400 transition-colors ${readOnly ? 'border-slate-700 text-slate-400' : 'border-slate-600 text-white'}`}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>

                    {!readOnly && (
                        <div className="mt-8 flex justify-end">
                            <button 
                                onClick={checkAnswer}
                                className="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-bold py-3 px-8 rounded-xl shadow-[0_0_15px_rgba(34,197,94,0.4)] transform transition hover:-translate-y-1 active:translate-y-0 text-lg display-font tracking-wide"
                            >
                                CHECK ANSWER
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const LevelLayout = ({ levelId, onBack, children, xp, characterEmotion = 'normal', promptText }) => {
            const levelInfo = LEVELS.find(l => l.id === levelId);
            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
                        <button onClick={onBack} className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            <span className="hidden sm:inline font-semibold uppercase tracking-wider text-sm">Mission Map</span>
                        </button>
                        <div className="text-center">

                                <div className="flex flex-col items-center">
                                    <div className="w-48 border-b-2 border-slate-800 pb-2 text-center text-lg font-bold text-slate-700">Maha Eldardiry</div>
                                    <div className="text-sm text-slate-500 uppercase tracking-wider mt-2">Grade 4 Math Teacher</div>
                                </div>
                                
                                <div className="flex flex-col items-center justify-center w-24 h-24 rounded-full border-4 border-yellow-500 text-yellow-600 font-bold rotate-12 relative -top-6">
                                    <span className="text-xs">CCSS</span>
                                    <span className="text-lg">4.NBT.4</span>
                                </div>

                                <div className="flex flex-col items-center">
                                    <div className="w-48 border-b-2 border-slate-800 pb-2 text-center text-lg font-bold text-slate-700">{date}</div>
                                    <div className="text-sm text-slate-500 uppercase tracking-wider mt-2">Date of Completion</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };


        const App = () => {
            const [view, setView] = useState('start'); // start, map, training, level1... certificate
            const [studentName, setStudentName] = useState('');
            const [unlocked, setUnlocked] = useState(['training']);
            const [xp, setXp] = useState(0);
            const [animatingXp, setAnimatingXp] = useState(null);

            const handleStart = (e) => {
                e.preventDefault();
                if(studentName.trim().length > 0) setView('map');
            };

            const awardXP = (amount, nextLevelId) => {
                setAnimatingXp(amount);
                setTimeout(() => {
                    setXp(prev => prev + amount);
                    setAnimatingXp(null);
                    if(nextLevelId && !unlocked.includes(nextLevelId)) {
                        setUnlocked(prev => [...prev, nextLevelId]);
                    }
                    setView('map');
                }, 1500); // Wait for animations to finish before returning to map
            };

            // Floating XP Animation Overlay
            const XpAnimation = () => {
                if(!animatingXp) return null;
                return (
                    <div className="fixed inset-0 flex items-center justify-center z-50 bg-slate-900/80 backdrop-blur-sm transition-all duration-300">
                        <div className="text-center animate-bounce">
                            <h2 className="text-4xl font-bold text-white mb-4 display-font">MISSION ACCOMPLISHED</h2>
                            <div className="text-6xl font-black text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]">
                                +{animatingXp} XP
                            </div>
                        </div>
                    </div>
                );
            };

            if (view === 'start') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyan-900/20 rounded-full blur-[100px] pointer-events-none"></div>
                        
                        <div className="z-10 flex flex-col items-center text-center max-w-lg w-full">
                            <ZeroX emotion="happy" size="large" />
                            <h1 className="mt-8 text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-cyan-300 via-blue-500 to-purple-600 display-font tracking-tight drop-shadow-lg">
                                ZERO BREAKERS
                            </h1>
                            <h2 className="text-xl text-cyan-400 font-bold tracking-[0.2em] mt-2 mb-8 uppercase">The Regrouping Quest</h2>
                            
                            <form onSubmit={handleStart} className="w-full bg-slate-800/80 backdrop-blur p-8 rounded-2xl border border-slate-700 shadow-2xl flex flex-col gap-4">
                                <label className="text-slate-300 font-semibold text-left">Enter Recruit Name:</label>
                                <input 
                                    type="text" 
                                    required
                                    value={studentName}
                                    onChange={e => setStudentName(e.target.value)}
                                    placeholder="Your First Name"
                                    className="w-full text-2xl p-4 bg-slate-900 border-2 border-slate-600 rounded-xl text-white focus:border-cyan-400 focus:outline-none transition-colors"
                                />
                                <button type="submit" className="w-full mt-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-4 rounded-xl text-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transform hover:-translate-y-1 transition-all display-font">
                                    INITIATE SEQUENCE
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === 'map') return <MapScreen unlocked={unlocked} onSelectLevel={setView} xp={xp} />;
            if (view === 'certificate') return <CertificateView studentName={studentName} date={new Date().toLocaleDateString()} onBack={() => setView('map')} />;

            // Render active level dynamically
            return (
                <>
                    <XpAnimation />
                    {view === 'training' && <TrainingLab xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level1')} />}
                    {view === 'level1' && <Level1 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level2')} />}
                    {view === 'level2' && <Level2 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level3')} />}
                    {view === 'level3' && <Level3 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level4')} />}
                    {view === 'level4' && <Level4 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level5')} />}
                    {view === 'level5' && <Level5 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'level6')} />}
                    {view === 'level6' && <Level6 xp={xp} onBack={() => setView('map')} onComplete={(pts) => awardXP(pts, 'certificate')} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
